[project]
name = "unmute-tui"
version = "0.1.0"
description = "Terminal replica of unmute.sh: semantic VAD + fluent spoken conversation with an LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "onnxruntime>=1.17",
    "transformers>=4.40",
    "silero-vad>=5.1",
    "openai>=1.30",
    "textual>=0.60",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "edge-tts>=6.1",
    "huggingface_hub>=0.23",
    "kokoro-onnx>=0.6",
    "mlx-audio>=0.5",
    "pywebrtc-audio>=0.1",
]

[project.optional-dependencies]
# Local streaming speech-to-text (faster-whisper / CTranslate2).
stt = [
    "faster-whisper>=1.0",
]
# Everything.
all = [
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
unmute-tui = "unmute_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unmute_tui", "src/rvap"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
